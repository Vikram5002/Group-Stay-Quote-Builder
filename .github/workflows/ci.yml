name: ci

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Integration tests fail in CI without this, so they can never be skipped silently.
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      # Started as a step, not a service container, so a throttled image pull is retried
      # instead of failing the whole job before any test runs.
      - name: Start DynamoDB Local
        run: |
          image=public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:3.3.2
          for attempt in 1 2 3 4 5; do
            docker pull -q "$image" && break
            echo "pull failed (attempt $attempt), retrying"; sleep $((attempt * 10))
          done
          docker run -d --name dynamodb -p 8000:8000 "$image" -jar DynamoDBLocal.jar -inMemory -sharedDb
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not start"; docker logs dynamodb; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
